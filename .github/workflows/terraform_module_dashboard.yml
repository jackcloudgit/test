name: Build & publish module dashboard

env:
  DASHBOARD_DIR: scripts/python/terraform-module-dashboard

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/python/terraform-module-dashboard/**"
      - ".github/workflows/terraform_module_dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.DASHBOARD_DIR }}/requirements.txt

      - name: Install dependencies
        run: pip install -r "$DASHBOARD_DIR/requirements.txt"

      - name: Fetch module versions
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORG: ${{ vars.TFC_ORG }}
        working-directory: ${{ env.DASHBOARD_DIR }}
        run: python fetch_module_versions.py

      - name: Generate HTML page
        working-directory: ${{ env.DASHBOARD_DIR }}
        run: python generate_status_page.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DASHBOARD_DIR }}/public/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
